<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>

<body>

    <header>
        <h1>Questionário de HTML e CSS</h1>
    </header>

    <main>
        <form action="">
            <label for="q1">O que significa a sigla CSS?</label>
            <input type="text" name="q1" id="q1">

            <label for="q2">Como os atributos 'id' e 'class' são selecionados no CSS?</label>
            <textarea name="q2" id="q2"></textarea>

            <label for="q3">Qual das opções abaixo pé um comentário CSS válido?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Esolha uma...</option>
                <option value="opção 1">opção 1</option>
                <option value="opção 2">opção 2</option>
                <option value="opção 3">opção 3</option>
            </select>

            <label for="q4">Qual é a margem inferior dada por esta declaração?</label>
            <input type="number" name="q4">

            <button type="submit">Enviar Questionário</button>
        </form>
    </main>


</body>

</html>
