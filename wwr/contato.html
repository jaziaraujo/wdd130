<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco Corredeiras Rafting</title>
    <meta name="description" content="Projeto de Site de Rafting em Corredeiras, contatos dos instrutores">
    <meta name="author" content="Jazi de Araujo">
    <link rel="stylesheet" href="estilos/contato.css">
</head>

<body>

    <header>
        <img src="imagens/logotipo.png" alt="Rafting Logo">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>

    <main>

        <section class="info">
            <h1>Companhia de Rafting em Corredeiras</h1>

            <p>Avenida Mário Pinotti, 337</p>
            <p>Brotas | São Paulo | Brasil</p>
            <p>+55 14 98120-3502</p>
            <p>info@corredeirasrafting.com</p>
        </section>

        <section class="contatos">

            <div class="mapa">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14766.
                    745771414871!2d-48.12464811215008!3d-22.28986451616994!2m3
                    !1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c779b
                    1ef54476b%3A0x53ea79d1218530bb!2sBrotas%2C%20SP%2C
                    %2017380-000!5e0!3m2!1spt-BR!2sbr!4v1781390401987!5m2!1spt-BR!2sbr" width="600" height="450"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form>

                <label for="name">Nome</label>
                <input type="text" id="name" name="name">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email">

                <p>Propósito da Mensagem</p>

                <label>
                    <input type="radio" id="motivo" name="motivo">
                    Dúvida Geral
                </label>

                <label>
                    <input type="radio" id="motivo" name="motivo">
                    Pergunta sobre Reserva
                </label>

                <label>
                    <input type="radio" id="motivo" name="motivo">
                    Sugestão
                </label>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" rows=" 4"></textarea>

                <label>
                    <input type="checkbox" id="checkbox">
                    Por favor, me inscreva na newsletter mensal
                </label>

                <button type="submit">Entrar em Contato!</button>

            </form>

        </section>

        <section class="funcionarios">

            <h2>Estamos Aqui para Servi-lo</h2>

            <div class="perfilfuncionarios">

                <figure>
                    <img src="imagens/Instrutora Aline Moraes.jpg" alt="Funcionário 1">
                    <figcaption>Instrutora Aline Moraes</figcaption>
                </figure>

                <figure>
                    <img src="imagens/Instrutor Diego Sales.jpg" alt="Funcionário 2">
                    <figcaption>Instrutor Diego Sales</figcaption>
                </figure>

                <figure>
                    <img src="imagens/Instrutora Barbara Dias.jpg" alt="Funcionário 3">
                    <figcaption>Instrutora Barbara Dias</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Corredeiras | Jazi de Araujo </p>
        <nav class="redes-sociais">
            <a href="https://facebook.com">
                <img src="imagens/facebook.svg" alt="Ícone do Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="imagens/linkedin.svg" alt="Ícone do LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="imagens/instagram.svg" alt="Ícone do Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
